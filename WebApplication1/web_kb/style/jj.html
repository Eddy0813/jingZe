<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 滚动列表与 ECharts 图表展示</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
    <style>
        /* 重置默认样式 */
        * {
            padding: 0;
            margin: 0;
        }

        html {
            width: 100vw;
            height: 100vh;
        }

        body {
            width: 100%;
            height: 100%;
            background-color: #0389e2;
        }

        #app {
            width: 100%;
            height: 100%;
        }

        /* 页面标题样式 */
        .page-title {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-top: 10px;
            color: #fff;
            background-image: #c80c0cf0;
        }

        /* 表头样式：固定表头 */
        .scroll-header {
            display: flex;
            background-color: #09e98c;
            font-size: 20px;
            padding: 5px 10px;
            border-bottom: 1px solid #ccc;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 图表容器样式：放置柱状图和饼状图 */
        .chart-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 20px;
        }

        .chart-card {
            width: 48%;
            /* 调整卡片宽度以增加间距 */
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-right: 4%;
            /* 添加右侧间隔 */
        }

        .chart-card:last-child {
            margin-right: 1%;
            /* 最后一个卡片不需要右侧间隔 */
        }

        /* 设置图表大小 */
        .chart-container div {
            width: 100%;
            height: 280px;
        }

        /* 滚动列表容器 */
        .scroll-container {
            width: 100%;
            height: 45%;
            border: 1px solid #ddd;
            overflow: hidden;
            position: relative;
            margin-top: 20px;
        }

        .scroll-list {
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            list-style: none;
            animation: scroll 10s linear infinite;
        }

        .scroll-list li {
            display: flex;
            justify-content: space-between;
            white-space: nowrap;
            padding: 5px 10px;
            border-bottom: 1px solid #eee;
        }

        @keyframes scroll {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-100%);
            }
        }

        /* 列表项样式 */
        .col-batch,
        .col-material,
        .col-order,
        .col-fiber-weight,
        .col-resin-weight,
        .col-finished-weight,
        .col-alarm-fiber,
        .col-alarm-resin,
        .col-alarm-finished {
            text-align: center;
            padding: 10px;
        }

        .col-batch {
            width: 12%;
        }

        .col-material {
            width: 18%;
        }

        .col-order {
            width: 18%;
        }

        .col-fiber-weight {
            width: 14%;
        }

        .col-resin-weight {
            width: 14%;
        }

        .col-finished-weight {
            width: 14%;
        }

        .col-alarm-fiber,
        .col-alarm-resin,
        .col-alarm-finished {
            width: 8%;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="page-title">
            锦泽致盛敷纤生产看板
        </div>

        <div class="scroll-container">
            <!-- 表头 -->
            <div class="scroll-header">
                <span class="col-batch">批次号</span>
                <span class="col-material">物料编号</span>
                <span class="col-order">订单号</span>
                <span class="col-fiber-weight">敷纤重量</span>
                <span class="col-resin-weight">树脂重量</span>
                <span class="col-finished-weight">成品重量</span>
                <span class="col-alarm-fiber">报警(敷纤)</span>
                <span class="col-alarm-resin">报警(树脂)</span>
                <span class="col-alarm-finished">报警(成品)</span>
            </div>
            <!-- 滚动列表 -->
            <ul class="scroll-list">
                <li v-for="(item, index) in list" :key="index">
                    <span class="col-batch">{{ item.batch }}</span>
                    <span class="col-material">{{ item.material }}</span>
                    <span class="col-order">{{ item.order }}</span>
                    <span class="col-fiber-weight">{{ item.fiberWeight }}</span>
                    <span class="col-resin-weight">{{ item.resinWeight }}</span>
                    <span class="col-finished-weight">{{ item.finishedWeight }}</span>
                    <span class="col-alarm-fiber">{{ item.alarmFiber }}</span>
                    <span class="col-alarm-resin">{{ item.alarmResin }}</span>
                    <span class="col-alarm-finished">{{ item.alarmFinished }}</span>
                </li>
            </ul>
        </div>

        <div class="chart-container">
            <!-- 卡片容器 -->
            <div class="chart-card">
                <!-- 条形图 -->
                <div id="bar-chart"></div>
            </div>
            <div class="chart-card">
                <!-- 饼状图 -->
                <div id="pie-chart"></div>
            </div>
        </div>
    </div>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    list: [], // 模拟API数据列表
                    barData: [920, 200, 150, 80, 70, 110, 130], // 条形图数据
                    pieData: [40, 60, 30], // 饼图数据 (例如 [完成, 未完成])
                };
            },

            mounted() {
                // 模拟从后台获取数据
                setTimeout(() => {
                    this.list = [
                        { batch: 'A123', material: 'M001', order: 'ORD001', fiberWeight: 100, resinWeight: 50, finishedWeight: 150, alarmFiber: 'No', alarmResin: 'Yes', alarmFinished: 'No' },
                        { batch: 'A124', material: 'M002', order: 'ORD002', fiberWeight: 200, resinWeight: 100, finishedWeight: 300, alarmFiber: 'Yes', alarmResin: 'No', alarmFinished: 'Yes' },
                        { batch: 'A125', material: 'M003', order: 'ORD003', fiberWeight: 150, resinWeight: 75, finishedWeight: 225, alarmFiber: 'No', alarmResin: 'No', alarmFinished: 'Yes' },
                        { batch: 'A126', material: 'M004', order: 'ORD004', fiberWeight: 180, resinWeight: 90, finishedWeight: 270, alarmFiber: 'Yes', alarmResin: 'Yes', alarmFinished: 'No' },
                    ];
                }, 1000); // 模拟延时

                // 渲染条形图和饼图
                this.renderBarChart();
                this.renderPieChart();
            },

            methods: {
                // 渲染条形图
                renderBarChart() {
                    const barChart = echarts.init(document.getElementById("bar-chart"));
                    const barOptions = {
                        title: {
                            text: "每日产量",
                            left: "center",
                            textStyle: {
                                color: "#333", // 标题字体颜色
                                fontSize: 20
                            }
                        },
                        tooltip: {
                            trigger: "axis"
                        },
                        xAxis: {
                            type: "category",
                            data: ["周一", "周二", "周三", "周四", "周五", "周六", "周日"],
                            axisLine: {
                                lineStyle: {
                                    color: '#333',
                                    width: 2
                                }
                            }
                        },
                        yAxis: {
                            type: "value"
                        },
                        series: [
                            {
                                name: "产量",
                                type: "bar",
                                data: this.barData,
                                itemStyle: {
                                    color: "#00bfae",
                                    borderColor: "#fff",
                                    borderWidth: 1,
                                    barBorderRadius: [5, 5, 0, 0],
                                    shadowColor: 'rgba(0, 0, 0, 0.2)',
                                    shadowBlur: 10,
                                    shadowOffsetX: 5,
                                    shadowOffsetY: 5
                                },
                                label: {
                                    show: true,
                                    position: "top",
                                    color: "#333", // 标签文字颜色
                                    fontSize: 14
                                },
                                barWidth: 30
                            }
                        ]
                    };
                    barChart.setOption(barOptions);
                },

                // 渲染饼状图
                renderPieChart() {
                    const pieChart = echarts.init(document.getElementById("pie-chart"));
                    const pieOptions = {
                        title: {
                            text: "订单完成情况",
                            left: "center",
                            textStyle: {
                                color: "#333",
                                fontSize: 20
                            }
                        },
                        series: [
                            {
                                type: "pie",
                                radius: "50%",
                                data: [
                                    { value: this.pieData[0], name: "完成" },
                                    { value: this.pieData[1], name: "未完成" }
                                ],
                                label: {
                                    show: true,
                                    position: "center",
                                    formatter: "{b}: {c} ({d}%)", // 显示数值和百分比
                                    color: "#333",
                                    fontSize: 14
                                }
                            }
                        ]
                    };
                    pieChart.setOption(pieOptions);
                }
            }
        });

        app.mount('#app');
    </script>
</body>

</html>
