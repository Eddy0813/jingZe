<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锦泽致盛敷纤生产看板</title>
    <script src="./js/echarts.min.js"></script>
    <script src="./js/vue.js"></script>
    <script src="./js/axios.min.js"></script>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>
    <div id="app">
        <div class="dashboard-container">
            <div class="title">锦泽致盛敷纤生产看板</div>

            <!-- Table Section -->
            <div class="table-container">
                <!-- Fixed Header -->
                <div class="table-header">
                    <div>批次号</div>
                    <div>物料编号</div>
                    <div>订单号</div>
                    <div>敷纤重量</div>
                    <div>树脂重量</div>
                    <div>成品重量</div>
                    <div>报警(敷纤)</div>
                    <div>报警(树脂)</div>
                    <div>报警(成品)</div>
                </div>

                <!-- Scrollable Content -->
                <div class="scrollable-content">
                    <table>
                        <tbody>
                            <tr v-for="row in formattedTableData" :key="row.ID"
                                :class="{'highlight-row': row.sz === '偏重' || row.sz === '偏轻' || row.fq === '偏重' || row.fq === '偏轻' || row.cp === '偏重' || row.cp === '偏轻'}">
                                <td>{{ row.ProID }}</td>
                                <td>{{ row.ProNo }}</td>
                                <td>{{ row.OrderNo }}</td>
                                <td>{{ row.GFweight }}</td>
                                <td>{{ row.Resinweight }}</td>
                                <td>{{ row.JGWeigth }}</td>
                                <td>{{ row.sz }}</td>
                                <td>{{ row.fq }}</td>
                                <td>{{ row.cp }}</td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="charts-container">
                <div id="bar-chart" class="chart"></div>
                <div id="pie-chart" class="chart"></div>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    tableData: [],
                    barData: [],
                    barLabels: [],
                    pieData: [],
                };
            },
            computed: {
                formattedTableData() {
                    console.log(this.tableData)

                    // 格式化表格数据，保留两位小数
                    return this.tableData.map(row => ({
                        ...row,
                        GFweight: this.formatToTwoDecimal(row.GFweight),
                        Resinweight: this.formatToTwoDecimal(row.Resinweight),
                        JGWeigth: this.formatToTwoDecimal(row.JGWeigth),
                    }));
                }
            },
            mounted() {
                this.fetchDataFromAPI();
                window.addEventListener("resize", () => {
                    if (this.barChart) this.barChart.resize();
                    if (this.pieChart) this.pieChart.resize();
                });
            },

            methods: {
                formatToTwoDecimal(value) {
                    // 保留两位小数
                    if (typeof value === "number") {
                        return value.toFixed(2);
                    }
                    return value;
                },
                async fetchDataFromAPI() {
                    try {
                        // 获取表格数据
                        const tableResponse = await axios.get('/api/Views/CP');
                        this.tableData = tableResponse.data;

                        // 获取柱状图数据
                        const barResponse = await axios.get('/api/Views/Capacity');
                        this.barData = barResponse.data.map(item => item.qty);
                        this.barLabels = barResponse.data.map(item => item.date);

                        // 获取饼图数据
                        const pieResponse = await axios.get('/api/Views/Pass');
                        const pieDataRaw = pieResponse.data[0];
                        this.pieData = [
                            { value: pieDataRaw.pass, name: '合格' },
                            { value: pieDataRaw.total - pieDataRaw.pass, name: '不合格' }
                        ];

                        // 渲染图表
                        this.renderBarChart();
                        this.renderPieChart();

                    } catch (error) {
                        console.error("数据加载失败:", error);
                    }
                },

                renderBarChart() {
                    this.barChart = echarts.init(document.getElementById("bar-chart"));
                    const barOptions = {
                        title: {
                            text: "每日产量",
                            left: "center",
                            textStyle: {
                                color: "#ffffff",
                                fontSize: 24
                            }
                        },
                        tooltip: {
                            trigger: "axis"
                        },
                        xAxis: {
                            type: "category",
                            data: this.barLabels,
                            axisLine: {
                                lineStyle: {
                                    color: '#ffffff',
                                    width: 2
                                }
                            }
                        },
                        yAxis: {
                            type: "value"
                        },
                        series: [
                            {
                                name: "产量",
                                type: "bar",
                                data: this.barData,
                                itemStyle: {
                                    color: "aqua",
                                    borderColor: "black",
                                    borderWidth: 1,
                                    barBorderRadius: [5, 5, 0, 0]
                                },
                                label: {
                                    show: true,
                                    position: "top",
                                    color: "#ffffff",
                                    fontSize: 14,
                                    fontWeight: "bold"
                                },
                                barWidth: 30,
                            }
                        ]
                    };
                    this.barChart.setOption(barOptions);
                },

                renderPieChart() {
                    this.pieChart = echarts.init(document.getElementById("pie-chart"));
                    const pieOptions = {
                        title: {
                            text: "合格/不合格比例",
                            left: "center",
                            textStyle: {
                                color: "#ffffff",
                                fontSize: 24
                            }
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: "{b}: {c} ({d}%)"
                        },
                        series: [
                            {
                                name: "合格状态",
                                type: "pie",
                                radius: "30%",
                                data: this.pieData,
                                itemStyle: {
                                    borderRadius: 3,
                                    borderColor: "#fff",
                                    borderWidth: 2
                                },
                                label: {
                                    show: true,
                                    position: "innerside",
                                    color: "#ffffff",
                                    fontSize: 14,
                                    formatter: "{b}: {d}%"
                                },
                                radius: [0, "60%"],
                                center: ["50%", "50%"],
                                emphasis: {
                                    itemStyle: {
                                        shadowBlur: 10,
                                        shadowOffsetX: 0,
                                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                                    }
                                }
                            }
                        ]
                    };
                    this.pieChart.setOption(pieOptions);
                }
            },
        }).mount("#app");
    </script>

</body>

</html>
